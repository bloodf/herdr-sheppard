id = "bloodf.herdr-sheppard"
name = "Sheppard"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "OMP orchestrator and worker management plus native session flow graphs."
platforms = ["macos", "linux"]

[[actions]]
id = "open"
title = "Sheppard: orchestrators and workers"
contexts = ["workspace", "pane"]
command = ["python3", "../manager/crew.py", "open"]

[[actions]]
id = "browser"
title = "Sheppard: browser dashboard"
contexts = ["workspace", "pane"]
command = ["python3", "../manager/crew.py", "browser"]

[[panes]]
id = "crew"
title = "Sheppard"
placement = "popup"
width = "90%"
height = "85%"
command = ["python3", "../manager/crew.py", "popup"]

[[panes]]
id = "browser"
title = "Sheppard browser dashboard"
placement = "tab"
command = ["python3", "../manager/crew.py", "serve"]

[[panes]]
id = "graph"
title = "Sheppard session graph"
placement = "overlay"
command = ["bash", "herdr/open.sh"]

[[actions]]
id = "graph-open"
title = "Sheppard: focused session graph (overlay)"
contexts = ["pane", "workspace"]
command = ["bash", "herdr/pane.sh", "open"]

[[actions]]
id = "graph-split"
title = "Sheppard: focused session graph (split)"
contexts = ["pane", "workspace"]
command = ["bash", "herdr/pane.sh", "open", "split"]

[[actions]]
id = "graph-tab"
title = "Sheppard: focused session graph (tab)"
contexts = ["pane", "workspace"]
command = ["bash", "herdr/pane.sh", "open", "tab"]

[[actions]]
id = "setup-keys"
title = "Sheppard: install graph keybinding"
contexts = ["workspace"]
command = ["bash", "herdr/keys.sh", "setup"]

[[actions]]
id = "remove-keys"
title = "Sheppard: remove graph keybinding"
contexts = ["workspace"]
command = ["bash", "herdr/keys.sh", "remove"]
